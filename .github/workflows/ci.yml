name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: typecheck + unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The Windows job is informational until it has been run on a real Windows machine: a few tests start fake helper programs
    # through shebang lines, which Windows does not honour.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
